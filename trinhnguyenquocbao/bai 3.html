<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xếp loại học lực</title>
</head>
<body>
    <h2>CHUONG TRINH XEP LOAI HOC LUC</h2>
    <label for="">Nhập vào điểm số (0 - 100):</label>
    <input type="number" id="diem">
    <br><br>
    <button onclick="xeploai()">Xếp Loại</button>
    <p id="ketqua"></p>

    <script>
        function xeploai(){
            let diem = document.getElementById("diem").value;
            let ketqua = "";

            if (diem >= 90 && diem <= 100) {
                ketqua = "Xếp loại: A";
            } else if (diem >= 80 && diem <= 89) {
                ketqua = "Xếp loại: B";
            } else if (diem >= 70 && diem <= 79) {
                ketqua = "Xếp loại: C";
            } else if (diem >= 60 && diem <= 69) {
                ketqua = "Xếp loại: D";
            } else if (diem < 60 && diem >= 0) {
                ketqua = "Xếp loại: F";
            } else {
                ketqua = "Điểm không hợp lệ! Vui lòng nhập từ 0 đến 100.";
            }

            document.getElementById("ketqua").innerHTML = ketqua;
        }
    </script>
</body>
</html>
