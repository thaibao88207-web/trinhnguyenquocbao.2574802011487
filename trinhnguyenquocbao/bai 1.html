<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra số chẵn lẻ</title>
</head>
<body>
    <h2>Chương trình kiểm tra số chẵn – số lẻ</h2>
    
    <label for="numberInput">Nhập số nguyên:</label>
    <input type="number" id="numberInput" placeholder="Nhập vào một số"><br><br>
    
    <button onclick="checkEvenOdd()">Kiểm tra</button><br><br>
    
    <p id="result">Kết quả sẽ hiển thị ở đây</p>

    <script>
       function checkEvenOdd() {
           let inputVal = document.getElementById("numberInput").value;
           let resultElement = document.getElementById("result");
           if (inputVal === "") {
               resultElement.innerText = "Vui lòng nhập một số hợp lệ!";
               return;
           }
           let number = parseInt(inputVal);
           if (number % 2 === 0) {
               resultElement.innerText = number + " là số chẵn.";
           } else {
               resultElement.innerText = number + " là số lẻ.";
           }
       }
    </script>
</body>
</html>
