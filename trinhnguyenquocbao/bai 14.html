<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính chỉ số BMI</title>
</head>
<body>
    <h2>TINH CHI SO BMI</h2>
    <label>Nhập chiều cao (m):</label>
    <input type="number" step="0.01" id="chieucao">
    <br><br>
    <label>Nhập cân nặng (kg):</label>
    <input type="number" id="cannang">
    <br><br>
    <button onclick="tinhBMI()">Tính BMI</button>
    <p id="ketqua"></p>

    <script>
        function tinhBMI(){
            let chieucao = Number(document.getElementById("chieucao").value);
            let cannang = Number(document.getElementById("cannang").value);
            let ketqua = "";

            if (chieucao <= 0 || cannang <= 0) {
                document.getElementById("ketqua").innerHTML = "Vui lòng nhập chiều cao và cân nặng lớn hơn 0!";
                return;
            }

            let bmi = cannang / (chieucao * chieucao);
            
            let bmiLamTron = bmi.toFixed(2);
            let phanLoai = "";

            if (bmi < 18.5) {
                phanLoai = "Gầy";
            } else if (bmi >= 18.5 && bmi < 25) {
                phanLoai = "Bình thường";
            } else if (bmi >= 25 && bmi < 30) {
                phanLoai = "Thừa cân";
            } else {
                phanLoai = "Béo phì";
            }

            document.getElementById("ketqua").innerHTML = 
                "Chỉ số BMI của bạn là: <b>" + bmiLamTron + "</b><br>" +
                "Kết luận: <b>" + phanLoai + "</b>";
        }
    </script>
</body>
</html>
